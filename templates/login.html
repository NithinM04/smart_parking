
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GUPIO Parking - Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>
        .login-role-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 22px 0;
        }

        .login-role-option {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 86px;
            padding: 15px;
            text-align: center;
            border: 1px solid #444;
            border-radius: 10px;
            cursor: pointer;
            color: #bbb;
            background: #111;
            transition: 0.2s ease;
        }
        .login-role-option strong {
            display: block;
            width: 100%;
            text-align: center;
            font-size: 16px;
            font-weight: 700;
        }

        .login-role-option input {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .login-role-option:has(input:checked) {
            border-color: #ffc400;
            color: #ffc400;
            background: rgba(255, 196, 0, 0.08);
        }

        .login-role-option strong {
            display: block;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .login-register-link {
            text-align: center;
            margin-top: 18px;
            color: #999;
            font-size: 14px;
        }

        .login-register-link a {
            color: #ffc400;
            text-decoration: none;
        }

        .login-register-link a:hover {
            text-decoration: underline;
        }

        .login-register-link[hidden] {
            display: none;
        }

        @media (max-width: 480px) {
            .login-role-options {
                gap: 8px;
            }

            .login-role-option {
                min-height: 65px;
                padding: 10px;
            }
        }
    </style>
</head>

<body class="login-body">

    <main class="login-page">

        <section class="login-card">

            <!-- GUPIO LOGO -->
            <div class="login-logo-container">

                <img
                    src="{{ url_for(
                        'static',
                        filename='images/GUPIO Gear Logo with Tagline.png'
                    ) }}"
                    alt="GUPIO Logo"
                    class="gupio-logo">

            </div>


            <!-- LOGIN HEADING -->
            <div class="login-heading">

                <h1>Welcome to Gupio Parking</h1>

                <p>
                    Sign in to access your smart parking account.
                </p>

            </div>


            <!-- ERROR MESSAGE -->
            {% if error %}

                <div class="login-error">
                    {{ error }}
                </div>

            {% endif %}


            <!-- LOGIN FORM -->
            <form
                method="POST"
                action="{{ url_for('login') }}"
                class="login-form"
                id="loginForm">


                <!-- ACCOUNT TYPE SELECTION -->
                <div class="login-field">

                    <label>CHOOSE ACCOUNT TYPE</label>

                    <div class="login-role-options">

                        <!-- ADMIN -->
                        <label class="login-role-option">

                            <input
                                type="radio"
                                name="account_type"
                                value="admin"
                                {% if selected_role != 'customer' %}
                                    checked
                                {% endif %}>

                            <strong>ADMIN</strong>

                        </label>


                        <!-- CLIENT -->
                        <label class="login-role-option">

                            <input
                                type="radio"
                                name="account_type"
                                value="customer"
                                {% if selected_role == 'customer' %}
                                    checked
                                {% endif %}>

                            <strong>CLIENT</strong>

                        </label>

                    </div>

                </div>


                <!-- USERNAME / EMAIL -->
                <div class="login-field">

                    <label for="identity" id="identityLabel">
                        Username
                    </label>

                    <input
                        type="text"
                        id="identity"
                        name="identity"
                        placeholder="Enter admin username"
                        autocomplete="username"
                        value="{{ identity|default('') }}"
                        required>

                </div>


                <!-- PASSWORD -->
                <div class="login-field">

                    <label for="password">
                        PASSWORD
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required>

                </div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-button">

                    LOGIN

                </button>


                <!-- CLIENT REGISTRATION LINK -->
                <div
                    class="login-register-link"
                    id="registerLink"
                    {% if selected_role != 'customer' %}
                        hidden
                    {% endif %}>

                    New client?

                    <a href="{{ url_for('customer.customer_register') }}">
                        Create an account
                    </a>

                </div>

            </form>


            <!-- FOOTER -->
            <div class="login-footer">

                ESP32 • RFID • MySQL • Flask

            </div>

        </section>

    </main>


    <!-- ACCOUNT TYPE JAVASCRIPT -->
    <script>

        const roleInputs = document.querySelectorAll(
            'input[name="account_type"]'
        );

        const identityLabel =
            document.getElementById("identityLabel");

        const identityInput =
            document.getElementById("identity");

        const registerLink =
            document.getElementById("registerLink");


        function updateLoginType() {

            const selectedRole = document.querySelector(
                'input[name="account_type"]:checked'
            ).value;


            if (selectedRole === "customer") {

                // CLIENT LOGIN

                identityLabel.textContent = "EMAIL ADDRESS";

                identityInput.type = "email";

                identityInput.placeholder =
                    "Enter client email address";

                identityInput.autocomplete = "email";

                registerLink.hidden = false;

            } else {

                // ADMIN LOGIN

                identityLabel.textContent = "USERNAME";

                identityInput.type = "text";

                identityInput.placeholder =
                    "Enter admin username";

                identityInput.autocomplete = "username";

                registerLink.hidden = true;

            }

            // Clear previous account identity when switching roles
            identityInput.value = "";

        }


        // Listen for account type changes
        roleInputs.forEach(function(input) {

            input.addEventListener(
                "change",
                updateLoginType
            );

        });


        // Initialize selected account type
        updateLoginType();

    </script>

</body>
</html>
