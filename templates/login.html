<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>GUPIO Parking - Login</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body class="login-body">


    <main class="login-page">


        <section class="login-card">


            <!-- GUPIO LOGO -->

            <div class="login-logo-container">

                <img
                    src="{{ url_for('static', filename='images/GUPIO Gear Logo with Tagline.png') }}"
                    alt="GUPIO"
                    class="gupio-logo"
                >

            </div>


            <!-- HEADING -->

            <div class="login-heading">

                <h1>
                    Welcome to Gupio Parking
                </h1>

                <p>
                    Sign in to monitor the parking system.
                </p>

            </div>


            <!-- ERROR -->

            {% if error %}

            <div class="login-error">
                {{ error }}
            </div>

            {% endif %}


            <!-- LOGIN FORM -->

            <form
                method="POST"
                action="{{ url_for('login') }}"
                class="login-form"
            >


                <div class="login-field">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="login-field">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>


            </form>


            <!-- FOOTER -->

            <div class="login-footer">

                ESP32 • RFID • MySQL • Flask

            </div>


        </section>


    </main>


</body>

</html>
