<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Smart Parking System</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body class="login-page">


    <div class="login-card">


        <div class="login-logo">

            <div class="logo-icon">
                P
            </div>

            <div>

                <h1>
                    Smart Parking
                </h1>

                <span>
                    Management System
                </span>

            </div>

        </div>


        <div class="login-heading">

            <h2>
                Welcome Back
            </h2>

            <p>
                Sign in to monitor the parking system.
            </p>

        </div>


        {% if error %}

        <div class="login-error">

            {{ error }}

        </div>

        {% endif %}


        <form
            method="POST"
            action="{{ url_for('login') }}"
            autocomplete="off"
        >


            <label for="username">
                Username
            </label>


            <input
                id="username"
                name="username"
                type="text"
                placeholder="Enter username"
                required
                autofocus
            >


            <label for="password">
                Password
            </label>


            <input
                id="password"
                name="password"
                type="password"
                placeholder="Enter password"
                required
            >


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


        </form>


        <div class="login-footer">

            <span>
                ESP32 • RFID • MySQL • Flask
            </span>

        </div>


    </div>


</body>

</html>
